name: Daily market update

on:
  schedule:
    # 16:00 Asia/Taipei (UTC+8) on weekdays. GitHub Actions cron is UTC, so 08:00 UTC.
    # Runs Tue-Sat UTC (cron day-of-week 2-6) to land on Mon-Fri Taipei time.
    - cron: "0 8 * * 2-6"
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily batch
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_RECIPIENT_USER_IDS: ${{ secrets.LINE_RECIPIENT_USER_IDS }}
        run: python batch/run_daily.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "No data changes" || git commit -m "Daily data update $(date -u +%Y-%m-%d)"
          git push
