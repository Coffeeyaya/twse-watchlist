name: Daily market update

on:
  schedule:
    # 16:00 Asia/Taipei (UTC+8) on weekdays. GitHub Actions cron is UTC, so 08:00 UTC.
    # 08:00 UTC + 8h = 16:00 Taipei on the SAME calendar date (no midnight rollover), so the
    # UTC day-of-week and Taipei day-of-week are identical here — cron dow 1-5 (Mon-Fri) is
    # correct as-is, no shift needed. (Fixed 2026-08-23: this previously said 2-6, on the wrong
    # assumption that UTC->Taipei crossed a day boundary — it doesn't for this specific hour.)
    - cron: "0 8 * * 1-5"
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily batch
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_RECIPIENT_USER_IDS: ${{ secrets.LINE_RECIPIENT_USER_IDS }}
          # Not a secret — a plain boolean toggle. Prepends a "test, not formal" marker to every
          # LINE push while the tool is still a trial. Flip to "false" (or delete the line) once
          # it's trusted as formal — no code change needed, see batch/alerts.py.
          LINE_TEST_MODE: "true"
          # While LINE_TEST_MODE is on, send_line_push() reads this instead of
          # LINE_RECIPIENT_USER_IDS, so test pushes only reach the sender, not every recipient.
          LINE_TEST_RECIPIENT_USER_IDS: ${{ secrets.LINE_TEST_RECIPIENT_USER_IDS }}
        run: python batch/run_daily.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "No data changes" || git commit -m "Daily data update $(date -u +%Y-%m-%d)"
          git push
